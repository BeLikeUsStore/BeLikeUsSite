<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme: {
        extend: {
          animation: {
            'bounce-subtle': 'bounce 2s infinite',
          }
        }
      }
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <title>Loja — Curadoria Be Like Us</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-white text-black antialiased">

<header id="siteHeader" class="border-b fixed top-0 left-0 w-full bg-white z-50 transition-all duration-500">
  <div id="headerInner" class="container mx-auto px-4 flex items-center justify-between py-6 transition-all duration-500">
    <a href="/">
      <img src="/public/logo.png" id="logo" alt="Be Like Us" class="h-20 w-auto object-contain transition-all duration-500">
    </a>

    <nav class="hidden md:flex items-center gap-8 text-[11px] uppercase tracking-[0.2em]">
      <a href="/blog/index.html" class="hover:text-gray-400 transition">Blog</a>
      <a href="/loja/index.html" class="border-b border-black">Loja</a>
      <a href="/sobre/index.html" class="hover:text-gray-400 transition">Sobre</a>
      <a href="/contato/index.html" class="hover:text-gray-400 transition">Contato</a>
      
      <div class="relative" id="perfilMenu">
        <button id="perfilToggle" class="w-8 h-8 rounded-full border border-black flex items-center justify-center hover:bg-black group transition">
          <svg class="w-4 h-4 text-black group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </button>
        <div id="perfilDropdown" class="hidden absolute right-0 mt-3 w-44 bg-white border shadow-xl z-50">
          <div id="menuDeslogado">
            <a href="/perfil/login.html" class="block px-4 py-3 hover:bg-gray-50">Entrar</a>
          </div>
          <div id="menuLogado" class="hidden">
            <a href="/perfil/dashboard.html" class="block px-4 py-3 hover:bg-gray-50">Dashboard</a>
            <button id="logoutBtn" class="w-full text-left px-4 py-3 hover:bg-gray-50">Sair</button>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>

<main class="pt-40 bg-[#fbfbfb] min-h-screen">
  <div class="max-w-7xl mx-auto px-4 pb-20">
    <header class="text-center mb-16">
      <h1 class="text-5xl font-extralight tracking-tighter mb-4 italic">Combinações perfeitas</h1>
      <p class="text-gray-400 font-light tracking-widest text-xs uppercase">Curadoria Editorial Select</p>

      <div class="mt-12 flex flex-col md:flex-row items-center justify-between border-y border-gray-100 py-4 gap-4">
        <div class="flex flex-wrap justify-center gap-2">
          <button data-filtro="todos" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-black bg-black text-white transition-all">Todos</button>
          <button data-filtro="camisetas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Camisetas</button>
          <button data-filtro="blusas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Blusas</button>
          <button data-filtro="casacos" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Casacos</button>
          <button data-filtro="calcas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Calças</button>
          <button data-filtro="acessorios" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Acessórios</button>
        </div>

        <select id="ordenacao" class="bg-transparent text-[10px] uppercase tracking-widest focus:outline-none cursor-pointer border-none">
          <option value="">Ordenar por</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
        </select>
      </div>
    </header>

    <section id="produtosGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-12"></section>
  </div>
</main>

<footer class="border-t py-12 bg-white">
  <div class="max-w-7xl mx-auto px-4 text-[10px] tracking-[0.3em] text-gray-400 uppercase text-center">
    © <span id="year"></span> Be Like Us — Todos os direitos reservados.
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  
  // LOGICA DO SCROLL CORRIGIDA
  const header = document.getElementById('siteHeader');
  const headerInner = document.getElementById('headerInner');
  const logo = document.getElementById('logo');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      headerInner.classList.replace('py-6', 'py-3');
      logo.classList.replace('h-20', 'h-12');
      header.classList.add('shadow-sm');
    } else {
      headerInner.classList.replace('py-3', 'py-6');
      logo.classList.replace('h-12', 'h-20');
      header.classList.remove('shadow-sm');
    }
  });
</script>

<script type="module" src="/loja/loja.js"></script>
<script type="module" src="/js/perfil-menu.js"></script>

</body>
</html>
