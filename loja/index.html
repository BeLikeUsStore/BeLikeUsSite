<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { 
      theme: {
        extend: {
          animation: {
            'bounce-subtle': 'bounce 2s infinite',
          }
        }
      }
    }
  </script>

  <script type="importmap">
  {
    "imports": {
      "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
    }
  }
  </script>

  <title>Loja — Curadoria Be Like Us</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="bg-white text-black antialiased">

<header id="siteHeader" class="border-b fixed top-0 left-0 w-full bg-white z-50 transition-all duration-500">
  <div id="headerInner" class="container mx-auto px-4 relative flex items-center justify-center md:justify-between py-6 transition-all duration-500">
    
    <!-- BOTÃO MOBILE (HAMBÚRGUER) - FIXO À ESQUERDA -->
    <div class="absolute left-4 md:hidden flex items-center">
      <button id="menuToggle" aria-label="Abrir menu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="black" stroke-width="2" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
    </div>

    <!-- LOGO (CENTRALIZADA NO MOBILE, À ESQUERDA NO DESKTOP) -->
    <a href="/" class="absolute left-1/2 -translate-x-1/2 md:static md:translate-x-0">
      <img src="/public/logo.png" id="logo" alt="Be Like Us" class="h-20 w-auto object-contain transition-all duration-500">
    </a>

    <!-- NAVEGAÇÃO DESKTOP -->
    <nav class="hidden md:flex items-center gap-8 text-[11px] uppercase tracking-[0.2em]">
      <a href="/blog/index.html" class="hover:text-gray-400 transition">Blog</a>
      <a href="/loja/index.html" class="border-b border-black">Loja</a>
      <a href="/sobre/index.html" class="hover:text-gray-400 transition">Sobre</a>
      <a href="/contato/index.html" class="hover:text-gray-400 transition">Contato</a>
      
      <div class="relative" id="perfilMenu">
        <button id="perfilToggle" class="w-8 h-8 rounded-full border border-black flex items-center justify-center hover:bg-black group transition">
          <svg class="w-4 h-4 text-black group-hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="12" cy="8" r="4" /><path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
          </svg>
        </button>
        <div id="perfilDropdown" class="hidden absolute right-0 mt-3 w-44 bg-white border shadow-xl z-50">
          <div id="menuDeslogado">
            <a href="/perfil/login.html" class="block px-4 py-3 hover:bg-gray-50">Entrar</a>
          </div>
          <div id="menuLogado" class="hidden">
            <a href="/perfil/dashboard.html" class="block px-4 py-3 hover:bg-gray-50">Dashboard</a>
            <button id="logoutBtn" class="w-full text-left px-4 py-3 hover:bg-gray-50">Sair</button>
          </div>
        </div>
      </div>
    </nav>
  </div>
</header>

<!-- MENU MOBILE OVERLAY -->
<div
  id="mobileMenu"
  class="fixed inset-0 bg-white z-50 hidden translate-x-[-100%] transition-transform duration-300 ease-in-out"
>
  <div class="p-6 flex flex-col gap-6 text-lg">
    <!-- BOTÃO FECHAR -->
    <button id="menuClose" class="self-end text-2xl" aria-label="Fechar menu">
      ✕
    </button>

    <!-- LOGO -->
    <div class="flex justify-center mb-4">
      <img
        src="/public/logo.png"
        alt="Be Like Us"
        class="h-16 w-auto"
      />
    </div>

    <!-- LINKS -->
    <a href="/blog/index.html" class="border-b pb-2">Do blog</a>
    <a href="/sobre/index.html" class="border-b pb-2">Sobre</a>
    <a href="/contato/index.html" class="border-b pb-2">Contato</a>
    <a href="/loja/index.html" class="border-b pb-2">Loja</a>
  </div>
  
  <!-- PERFIL MOBILE -->
  <div class="border-b pb-6 mb-6">
    <button
      id="perfilToggleMobile"
      class="w-12 h-12 mx-auto rounded-full border border-black flex items-center justify-center hover:bg-black group transition"
      aria-label="Menu do perfil"
    >
      <svg
        class="w-6 h-6 text-black group-hover:text-white"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        viewBox="0 0 24 24"
      >
        <circle cx="12" cy="8" r="4" />
        <path d="M4 20c0-4 4-6 8-6s8 2 8 6" />
      </svg>
    </button>

    <div
      id="perfilDropdownMobile"
      class="hidden mt-4 text-center text-base"
    >
      <div id="menuDeslogadoMobile">
        <a href="/perfil/login.html" class="block py-2 hover:underline">
          Entrar
        </a>
        <a href="/perfil/login.html" class="block py-2 hover:underline">
          Criar conta
        </a>
      </div>

      <div id="menuLogadoMobile" class="hidden">
        <a href="/perfil/dashboard.html" class="block py-2 hover:underline">
          Perfil
        </a>
        <button
          id="logoutBtnMobile"
          class="w-full py-2 hover:underline"
        >
          Sair
        </button>
      </div>
    </div>
  </div>
</div>

<main class="pt-40 bg-[#fbfbfb] min-h-screen">
  <div class="max-w-7xl mx-auto px-4 pb-20">
    <header class="text-center mb-16">
      <h1 class="text-5xl font-extralight tracking-tighter mb-4 italic">Combinações perfeitas</h1>
      <p class="text-gray-400 font-light tracking-widest text-xs uppercase">Curadoria Editorial Select</p>

      <div class="mt-8 flex justify-center gap-8 border-b border-gray-100 pb-4 max-w-xs mx-auto">
        <button data-genero="masculino" class="genero-btn text-[11px] uppercase tracking-[0.2em] font-medium text-black border-b border-black pb-1 transition-all">
          Masculino
        </button>
        <button data-genero="feminino" class="genero-btn text-[11px] uppercase tracking-[0.2em] font-medium text-gray-400 hover:text-black transition-all">
          Feminino
        </button>
      </div>

      <div class="mt-12 flex flex-col md:flex-row items-center justify-between border-y border-gray-100 py-4 gap-4">
        <div class="flex flex-wrap justify-center gap-2">
          <button data-filtro="todos" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-black bg-black text-white transition-all">Todos</button>
          <button data-filtro="camisetas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Camisetas</button>
          <button data-filtro="blusas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Blusas</button>
          <button data-filtro="casacos" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Casacos</button>
          <button data-filtro="calcas" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Calças</button>
          <button data-filtro="acessorios" class="px-5 py-1.5 text-[10px] uppercase tracking-widest border border-gray-200 hover:border-black transition-all">Acessórios</button>
        </div>

        <select id="ordenacao" class="bg-transparent text-[10px] uppercase tracking-widest focus:outline-none cursor-pointer border-none">
          <option value="">Ordenar por</option>
          <option value="menor">Menor preço</option>
          <option value="maior">Maior preço</option>
        </select>
      </div>
    </header>

    <section id="produtosGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-x-6 gap-y-12"></section>
  </div>
</main>

<footer class="border-t py-12 bg-white">
  <div class="max-w-7xl mx-auto px-4 text-center">
    <div class="text-[10px] tracking-[0.3em] text-gray-400 uppercase mb-4">
      © <span id="year"></span> Be Like Us — Todos os direitos reservados.
    </div>
    
    <div class="flex flex-wrap justify-center gap-6">
      <a href="/termos.html" class="text-[9px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition">Termos de Uso</a>
      <a href="/privacidade.html" class="text-[9px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition">Privacidade</a>
      <a href="/sobre/index.html" class="text-[9px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition">Sobre</a>
      <a href="/contato/index.html" class="text-[9px] uppercase tracking-[0.2em] text-gray-400 hover:text-black transition">Contato</a>
    </div>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
  
  const header = document.getElementById('siteHeader');
  const headerInner = document.getElementById('headerInner');
  const logo = document.getElementById('logo');

  window.addEventListener('scroll', () => {
    if (window.scrollY > 50) {
      headerInner.classList.replace('py-6', 'py-3');
      logo.classList.replace('h-20', 'h-12');
      header.classList.add('shadow-sm');
    } else {
      headerInner.classList.replace('py-3', 'py-6');
      logo.classList.replace('h-12', 'h-20');
      header.classList.remove('shadow-sm');
    }
  });
</script>

<!-- SCRIPT DE ABERTURA/FECHAMENTO DO MENU MOBILE CORRIGIDO -->
<script>
const initMobileMenu = () => {
  const openBtn = document.getElementById("menuToggle");
  const closeBtn = document.getElementById("menuClose");
  const menu = document.getElementById("mobileMenu");

  if (!openBtn || !closeBtn || !menu) return;

  openBtn.addEventListener("click", () => {
    menu.classList.remove("hidden", "translate-x-[-100%]");
    menu.classList.add("translate-x-0");
    document.body.classList.add("overflow-hidden");
  });

  closeBtn.addEventListener("click", () => {
    menu.classList.add("hidden", "translate-x-[-100%]");
    menu.classList.remove("translate-x-0");
    document.body.classList.remove("overflow-hidden");
  });
};

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initMobileMenu);
} else {
  initMobileMenu();
}
</script>

<script type="module" src="/loja/loja.js"></script>
<script type="module" src="/js/perfil-menu.js"></script>

</body>
</html>
